name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check tag format
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || { echo "Tag '$GITHUB_REF_NAME' does not match required format vX.Y.Z or vX.Y.Z-beta.N"; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish Windows binary
        run: |
          dotnet publish src/App/App.csproj --configuration Release --runtime win-x64 --self-contained true -p:Version="$VERSION" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=true -p:TrimMode=partial --output publish/win-x64
          cp publish/win-x64/TokaZerkUIManager.exe TokaZerkUIManager-win-x64.exe

      - name: Publish Linux binary
        run: |
          dotnet publish src/App/App.csproj --configuration Release --runtime linux-x64 --self-contained true -p:Version="$VERSION" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=true -p:TrimMode=partial --output publish/linux-x64
          cp publish/linux-x64/TokaZerkUIManager TokaZerkUIManager-linux-x64

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: TokaZerk UI Manager ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          generate_release_notes: true
          files: |
            TokaZerkUIManager-win-x64.exe
            TokaZerkUIManager-linux-x64
